name: release

# Every pull request builds the engine and the host tools as a check. A push
# to main (a direct commit or a merged pull request) also publishes a GitHub
# Release named after VERSION, whose asset is a self-contained "everything
# you need to build the ROM" archive: drop in your own GTA 2 files, then run
# build.cmd / tools/pack_rom.py -- no Docker, no N64 toolchain required.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/n64brew/libdragon:preview   # mips64-elf toolchain + $N64_INST

    steps:
      - name: Install packaging deps
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends zip rsync git patch python3 ca-certificates \
            gcc g++ gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Version
        id: ver
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"

      - name: Build libdragon (pinned) + engine
        run: |
          bash tools/fetch_libdragon.sh
          make -C libdragon -j"$(nproc)" install
          # The library `install` target doesn't build the host tools; `make
          # engine` needs n64sym + n64elfcompress + mksprite (logo sprites).
          make -C libdragon/tools -j"$(nproc)" n64sym-install n64elfcompress-install mksprite-install
          bash setup_engine.sh
          # Linux is case-sensitive; the decompiled sources use mixed-case #includes.
          python3 tools/ci_links.py
          make -j"$(nproc)" engine
          ls -lR build/engine

      - name: Build the host tools (Linux + Windows)
        run: |
          mkdir -p hosttools/linux hosttools/windows
          LDFLAGS=-static bash tools/vendor/bin/build-tools.sh
          cp tools/vendor/bin/n64tool tools/vendor/bin/mkdfs tools/vendor/bin/ed64romconfig tools/vendor/bin/audioconv64 hosttools/linux/
          CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ bash tools/vendor/bin/build-tools.sh
          cp tools/vendor/bin/*.exe hosttools/windows/
          ls -l hosttools/*

      - name: Stage the bundle
        id: stage
        run: |
          set -eu
          NAME="N64GTA2Port-${{ steps.ver.outputs.version }}"
          DEST="stage/$NAME"
          mkdir -p "$DEST"
          # exactly the tracked source (the git-ignored game data and the
          # downloaded gta2_re sources are excluded by definition)
          git ls-files -z | rsync -a --files-from=- --from0 ./ "$DEST/"
          # the CI-built binaries the packer needs
          cp -r build/engine/. "$DEST/tools/vendor/engine/"
          cp hosttools/linux/* hosttools/windows/* "$DEST/tools/vendor/bin/"
          # provenance
          {
            echo "N64GTA2Port ${{ steps.ver.outputs.version }}"
            echo "commit:  ${GITHUB_SHA}"
            echo "ref:     ${GITHUB_REF}"
            echo "run:     ${GITHUB_RUN_NUMBER}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$DEST/BUILD_INFO.txt"
          ( cd stage && zip -qr "../$NAME.zip" "$NAME" )
          ls -l "$NAME.zip"
          echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.asset }}
          path: ${{ steps.stage.outputs.asset }}
          retention-days: 14

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: N64GTA2Port ${{ steps.ver.outputs.version }}
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.stage.outputs.asset }}
